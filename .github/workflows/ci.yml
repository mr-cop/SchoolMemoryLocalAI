name: Lightweight validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public repository safety
        run: python3 scripts/check_public_safety.py
      - name: Lock, schema, and manifest validation
        run: python3 scripts/validate_lock.py
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Integrity and packaging tests
        run: python3 -m unittest discover -s tests -v
