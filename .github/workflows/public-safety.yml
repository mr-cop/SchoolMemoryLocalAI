name: Public safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public repository safety
        run: python3 scripts/check_public_safety.py
      - name: Validate model lock
        run: python3 scripts/validate_lock.py
